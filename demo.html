<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NewsSum 动画展示 Demo</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5efe6;
        --paper: #fffaf2;
        --ink: #211915;
        --muted: #77695f;
        --line: #dfd2c1;
        --accent: #c15f3f;
        --olive: #727a4e;
        --blue: #597f9f;
        --spring: cubic-bezier(0.22, 1.35, 0.36, 1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        background:
          radial-gradient(circle at 18% 12%, rgba(193, 95, 63, 0.12), transparent 30%),
          linear-gradient(180deg, #fbf7ef 0%, var(--bg) 55%, #eee4d7 100%);
        color: var(--ink);
      }

      .shell {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 42px;
      }

      .bar,
      .card,
      .runbar {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(255, 250, 242, 0.82);
        box-shadow: 0 18px 46px rgba(61, 45, 31, 0.08);
        backdrop-filter: blur(18px);
      }

      .bar {
        position: sticky;
        top: 16px;
        z-index: 3;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 18px;
        padding: 12px 16px;
        animation: drop 0.72s var(--spring) both;
      }

      .brand strong,
      .brand small {
        display: block;
      }

      .brand strong {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 18px;
      }

      .brand small,
      .local,
      .eyebrow,
      .muted,
      .tag {
        color: var(--muted);
      }

      .tabs {
        display: flex;
        gap: 8px;
      }

      button {
        border: 1px solid #c9b7a3;
        border-radius: 9px;
        background: #fffaf2;
        color: var(--ink);
        padding: 10px 16px;
        cursor: pointer;
        transform: scale(1);
        transition: transform 0.34s var(--spring), box-shadow 0.22s ease, border-color 0.22s ease;
      }

      button:hover {
        border-color: var(--accent);
        box-shadow: 0 10px 24px rgba(61, 45, 31, 0.1);
        transform: translateY(-2px) scale(1.035);
      }

      button:active {
        transform: translateY(1px) scale(0.94);
      }

      .active {
        background: #efe4d6;
      }

      .local {
        justify-self: end;
        text-align: right;
        font-size: 13px;
      }

      .local strong {
        display: block;
        color: var(--olive);
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 24px;
        align-items: end;
        padding: 44px 0 26px;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", "Songti SC", serif;
        font-size: clamp(42px, 5.2vw, 72px);
        font-weight: 500;
        line-height: 1.04;
        white-space: nowrap;
        animation: lift 0.68s var(--spring) 0.08s both;
      }

      .eyebrow {
        margin: 0 0 10px;
        font-weight: 700;
      }

      .hero-copy {
        margin: 14px 0 0;
        max-width: 720px;
        color: var(--muted);
        line-height: 1.8;
        animation: lift 0.68s var(--spring) 0.16s both;
      }

      .orbital {
        position: relative;
        height: 240px;
        animation: pop 0.9s var(--spring) 0.18s both;
      }

      .orbit {
        position: absolute;
        inset: 30px;
        border: 1px solid rgba(201, 183, 163, 0.8);
        border-radius: 50%;
        animation: rotate 16s linear infinite;
      }

      .orbit:nth-child(2) {
        inset: 54px;
        animation-duration: 10s;
        animation-direction: reverse;
      }

      .node {
        position: absolute;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 10px 24px rgba(193, 95, 63, 0.25);
      }

      .orbit .node {
        left: 50%;
        top: -9px;
      }

      .core {
        position: absolute;
        left: 50%;
        top: 50%;
        display: grid;
        place-items: center;
        width: 116px;
        height: 116px;
        border-radius: 28px;
        background: rgba(255, 250, 242, 0.9);
        border: 1px solid var(--line);
        transform: translate(-50%, -50%);
        animation: breathe 2.6s ease-in-out infinite;
      }

      .core svg {
        width: 76px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .card {
        overflow: hidden;
        animation: cardIn 0.62s var(--spring) both;
        transition: transform 0.38s var(--spring), box-shadow 0.24s ease;
      }

      .card:nth-child(2) {
        animation-delay: 0.08s;
      }

      .card:hover {
        transform: translateY(-4px) scale(1.008);
        box-shadow: 0 24px 58px rgba(61, 45, 31, 0.12);
      }

      .card-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
        background: rgba(239, 228, 214, 0.6);
      }

      .card h2,
      .runbar h2 {
        margin: 0;
        font-size: 18px;
      }

      .tag {
        font-size: 13px;
      }

      .fake-text {
        display: grid;
        gap: 10px;
        min-height: 220px;
        padding: 18px;
      }

      .line {
        height: 11px;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(193, 95, 63, 0.2), rgba(89, 127, 159, 0.16), rgba(114, 122, 78, 0.14));
        transform-origin: left;
        animation: write 1.2s var(--spring) both;
      }

      .line:nth-child(2) { width: 86%; animation-delay: 0.08s; }
      .line:nth-child(3) { width: 72%; animation-delay: 0.16s; }
      .line:nth-child(4) { width: 94%; animation-delay: 0.24s; }
      .line:nth-child(5) { width: 58%; animation-delay: 0.32s; }

      .runbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin: 16px 0;
        padding: 16px 18px;
        animation: lift 0.62s var(--spring) 0.22s both;
      }

      .actions {
        display: flex;
        gap: 10px;
      }

      .primary {
        background: var(--ink);
        color: #fffaf2;
        border-color: var(--ink);
      }

      .warm {
        background: var(--accent);
        border-color: var(--accent);
        color: #fffaf2;
      }

      .chart {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 360px;
        margin-top: 16px;
      }

      svg {
        width: min(520px, 100%);
      }

      .tri-a,
      .tri-b {
        transform-origin: 260px 210px;
        animation: chartBounce 1s var(--spring) both;
      }

      .tri-b {
        animation-delay: 0.16s;
      }

      @keyframes drop {
        from { opacity: 0; transform: translateY(-18px) scale(0.98); }
        70% { opacity: 1; transform: translateY(2px) scale(1.004); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes lift {
        from { opacity: 0; transform: translateY(18px) scale(0.985); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes pop {
        from { opacity: 0; transform: scale(0.82); }
        68% { opacity: 1; transform: scale(1.045); }
        to { opacity: 1; transform: scale(1); }
      }

      @keyframes cardIn {
        from { opacity: 0; transform: translateY(18px) scale(0.98); }
        72% { opacity: 1; transform: translateY(-2px) scale(1.008); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes write {
        from { opacity: 0; transform: scaleX(0.18); }
        to { opacity: 1; transform: scaleX(1); }
      }

      @keyframes rotate {
        to { transform: rotate(360deg); }
      }

      @keyframes breathe {
        0%, 100% { transform: translate(-50%, -50%) scale(1); }
        50% { transform: translate(-50%, -50%) scale(1.045); }
      }

      @keyframes chartBounce {
        from { opacity: 0; transform: scale(0.72); }
        65% { opacity: 1; transform: scale(1.055); }
        to { opacity: 1; transform: scale(1); }
      }

      @media (max-width: 900px) {
        .bar,
        .hero,
        .grid,
        .runbar {
          grid-template-columns: 1fr;
        }

        .bar,
        .runbar {
          display: grid;
        }

        .tabs,
        .actions {
          flex-wrap: wrap;
        }

        .local {
          justify-self: start;
          text-align: left;
        }

        h1 {
          white-space: normal;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="bar">
        <div class="brand">
          <strong>NewsSum Lab</strong>
          <small>TextRank / Qwen LoRA</small>
        </div>
        <nav class="tabs">
          <button class="active" type="button">摘要对比</button>
          <button type="button">ROUGE 图谱</button>
          <button type="button">参数设置</button>
        </nav>
        <div class="local">
          <strong>Local only</strong>
          <span>纯前端动画展示</span>
        </div>
      </header>

      <section class="hero">
        <div>
          <p class="eyebrow">中文新闻文本自动摘要生成</p>
          <h1>抽取式与生成式摘要对比</h1>
          <p class="hero-copy">这是一个无需安装依赖的静态展示页，用来预览页面动效、卡片入场、按钮回弹、图表展开和文本生成占位效果。</p>
        </div>
        <div class="orbital" aria-hidden="true">
          <div class="orbit"><span class="node"></span></div>
          <div class="orbit"><span class="node"></span></div>
          <div class="core">
            <svg viewBox="0 0 120 104">
              <polygon points="60,4 116,100 4,100" fill="rgba(193,95,63,.22)" />
              <polygon points="60,20 101,92 19,92" fill="rgba(89,127,159,.24)" />
              <polygon points="60,38 86,84 34,84" fill="rgba(114,122,78,.24)" />
            </svg>
          </div>
        </div>
      </section>

      <section class="grid">
        <article class="card">
          <div class="card-head">
            <div>
              <span class="tag">Extractive</span>
              <h2>TextRank 摘要</h2>
            </div>
            <button type="button">评分</button>
          </div>
          <div class="fake-text">
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
          </div>
        </article>

        <article class="card">
          <div class="card-head">
            <div>
              <span class="tag">Generative</span>
              <h2>Qwen2.5-7B-Instruct + LoRA</h2>
            </div>
            <button type="button">评分</button>
          </div>
          <div class="fake-text">
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
          </div>
        </article>
      </section>

      <section class="runbar">
        <div>
          <h2>运行摘要生成</h2>
          <p class="muted">按钮只展示弹性动效，不会调用接口。</p>
        </div>
        <div class="actions">
          <button type="button">运行 TextRank</button>
          <button class="primary" type="button">运行 Qwen LoRA</button>
          <button class="warm" type="button">全部运行</button>
        </div>
      </section>

      <section class="card chart">
        <svg viewBox="0 0 520 430" aria-label="ROUGE 三角动画">
          <polygon points="260,54 395,288 125,288" fill="none" stroke="#d7c8b4" />
          <polygon points="260,94 360,268 160,268" fill="none" stroke="#d7c8b4" />
          <polygon points="260,134 325,248 195,248" fill="none" stroke="#d7c8b4" />
          <line x1="260" y1="54" x2="260" y2="288" stroke="#cdbca7" stroke-dasharray="4 5" />
          <line x1="260" y1="210" x2="395" y2="288" stroke="#cdbca7" stroke-dasharray="4 5" />
          <line x1="260" y1="210" x2="125" y2="288" stroke="#cdbca7" stroke-dasharray="4 5" />
          <polygon class="tri-a" points="260,88 356,266 164,270" fill="rgba(89,127,159,.3)" stroke="#597f9f" stroke-width="3" />
          <polygon class="tri-b" points="260,72 386,282 150,252" fill="rgba(193,95,63,.3)" stroke="#c15f3f" stroke-width="3" />
          <text x="260" y="34" text-anchor="middle" fill="#77695f">ROUGE-1</text>
          <text x="420" y="304" text-anchor="middle" fill="#77695f">ROUGE-2</text>
          <text x="100" y="304" text-anchor="middle" fill="#77695f">ROUGE-L</text>
        </svg>
      </section>
    </main>
  </body>
</html>
